name: Verify notebooks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate notebook JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path("notebooks").glob("*.ipynb")):
              with p.open(encoding="utf-8") as f:
                  json.load(f)
              print("OK", p)
          PY

      - name: Execute notebooks from repository
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p executed_notebooks
          for nb in notebooks/*.ipynb; do
            name=$(basename "$nb")
            echo "Running $name"
            jupyter nbconvert               --to notebook               --execute "$nb"               --output "../executed_notebooks/$name"               --ExecutePreprocessor.timeout=600               --ExecutePreprocessor.kernel_name=python3
          done
